site_name: RuleEngine Architecture and Wiki
site_description: Developer guide and knowledge graph wiki for RuleEngine

docs_dir: graphify-out/wiki
site_dir: graphify-out/mkdocs-site

watch:
  - doc/architecture-and-developer-guide.md
  - graphify-out/GRAPH_REPORT.md

hooks:
  - mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
